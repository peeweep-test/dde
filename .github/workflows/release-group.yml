name: Release group

# 先保留本组基线草稿 PR，再并行派发；未完成的发布不能换目标版本。
on:
  workflow_dispatch:
    inputs:
      group:
        description: 组
        required: true
        type: choice
        options: [G1, G2, G3, G4, G5]
      version:
        description: 目标版本（相同目标可恢复未完成的发布）
        required: true
        type: string
      dry_run:
        description: 只检查并打印计划，不创建 PR 或派发
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-group-${{ inputs.group }}
  cancel-in-progress: false

jobs:
  plan:
    uses: ./.github/workflows/sync-baseline.yml
    with:
      group: ${{ inputs.group }}
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  dispatch:
    needs: plan
    if: ${{ !inputs.dry_run && needs.plan.outputs.repos != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJSON(needs.plan.outputs.repos) }}
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.member.repo }}
          permission-actions: write
          permission-contents: read

      - name: Dispatch ${{ matrix.member.repo }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          GROUP: ${{ inputs.group }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ matrix.member.repo }}
          BASE: ${{ matrix.member.base }}
          WORKFLOW: ${{ matrix.member.workflow }}
          ACTOR: ${{ github.actor }}
          EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          set -euo pipefail
          if [ "$GROUP" = "G1" ]; then
            gh workflow run "$WORKFLOW" -R "$REPO" --ref "$BASE" \
              -f version="$VERSION" \
              -f name="$ACTOR" \
              -f email="$EMAIL" \
              -f timezone=Asia/Shanghai
          else
            gh workflow run "$WORKFLOW" -R "$REPO" --ref "$BASE" \
              -f version="$VERSION" \
              -f name="$ACTOR" \
              -f email="$EMAIL" \
              -f base_branch="$BASE" \
              -f distribution=unstable \
              -f create_pr=true
          fi
          echo "已触发 $REPO -> $VERSION；成员执行结果见基线 PR"
