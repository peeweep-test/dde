# DDE 组版本基线
#
# 唯一事实来源：每组包含哪些仓库、这一组当前的统一版本。
# 规则：
#   1. version 不带 epoch；成员保留现有 epoch，去掉 epoch 后必须等于本组的 version；
#   2. 组内任一仓库有更新，整组一起升 version 并一起重新打包；
#   3. 依赖关系（debian/control 里的 >= / >>）不因此修改。
# 首次统一前，version 作为起始基线；组目标须高于它，各成员完整目标须高于当前版本。
# 原始发布记录固定完整成员目标；后续轮次要求当前完整版本与上轮目标一致。
#
# 基线 PR 的 group-release-ready 检查确认整组完成；组件侧校验尚未接入。

repo_overrides: {}

groups:
  G1:
    name: Validation G1
    version: "6.7.52"
    members:
      - dtkcore

  G2:
    name: Validation G2
    version: "6.0.51"
    members:
      - go-lib
      - go-dbus-factory

  G3:
    name: Validation input preflight
    version: "6.0.50"
    members:
      - go-lib
      - go-dbus-factory
